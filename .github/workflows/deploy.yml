# Manual fallback only. Cloudflare Pages Git integration remains the automatic
# publisher. Use only when it is unavailable and no automatic build is in flight.
# This fallback rebuilds the verified source; it does not reuse the CI artifact.
# See docs/GITHUB_OPERATIONS.md before dispatching a production release.
name: Deploy to Cloudflare Pages (manual fallback)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      deployments: write
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_WRITE_LOGS: "false"

    steps:
      - name: Require successful CI for this main commit
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              event: 'push',
              head_sha: context.sha,
              status: 'success',
              per_page: 1,
            });
            if (!data.workflow_runs.some(run => run.head_sha === context.sha && run.conclusion === 'success')) {
              core.setFailed(`No successful CI push run exists for ${context.sha}. Wait for CI and dispatch again.`);
            }

      - name: Checkout exact verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate public Turnstile configuration
        run: |
          node --input-type=module <<'NODE'
          import { resolveTurnstileSiteKey } from './src/utils/turnstile.ts';
          if (!resolveTurnstileSiteKey(process.env.PUBLIC_TURNSTILE_SITE_KEY)) {
            console.error('PUBLIC_TURNSTILE_SITE_KEY must contain a real public site key before production deployment.');
            process.exitCode = 1;
          }
          NODE
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Build site
        run: npm run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Reject a stale production commit
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            });
            if (data.object.sha !== context.sha) {
              core.setFailed(`main advanced from ${context.sha} to ${data.object.sha}; dispatch again after its CI passes.`);
            }

      - name: Deploy verified main commit to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=integrautomacao-com-br --branch=main --commit-hash=${{ github.sha }} --commit-dirty=false
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
