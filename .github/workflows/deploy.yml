# Manual deploy fallback to Cloudflare Pages.
#
# Production deploys are handled by the Cloudflare Pages → GitHub direct
# integration (Opção A in README.md), which already runs `npm run build`
# automatically on every push to main and creates preview deploys for PRs.
# Running this workflow on the same triggers would deploy twice and fight
# the CDN cache.
#
# This workflow stays here as a manual fallback (workflow_dispatch) for
# situations where the direct integration is unavailable AND no automatic
# deployment is in flight. Do not use it to override a running production
# build.
#
# This legacy fallback still accepts a branch input and rebuilds independently;
# it is not the deterministic artifact workflow proposed in the platform plan.
# For production, leave the input as `main` and verify the resulting commit in
# Cloudflare before promoting or announcing the release.
#
# Do not activate full CI deploys by merely uncommenting triggers. Implement the
# SHA-pinned artifact workflow from the platform plan, validate it, then retire
# the direct integration in a separately controlled cutover.

name: Deploy to Cloudflare Pages (manual fallback)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy (production must remain main)"
        required: false
        default: main
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=integrautomacao-com-br --branch=${{ inputs.branch || github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}';
            if (!url) return;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Preview deploy\n\n🔗 ${url}\n\nDeployed from \`${context.sha.slice(0,7)}\` to Cloudflare Pages.`
            });
